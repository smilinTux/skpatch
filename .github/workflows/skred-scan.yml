name: "skred: self-hardening security scan"

# Best-of-breed OSS scanners on every push/PR + nightly. HIGH+ findings fail
# the gate. Pattern mirrors smilinTux/skstacks's skred-scan.yml: gitleaks for
# secrets, Trivy for dependency/config CVEs, Semgrep for code-level issues,
# plus an estate-denylist gate so a real hostname/estate/client name can
# never land in this public repo.

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans history; a shallow clone hides most findings.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: install scanners (gitleaks, trivy, semgrep)
        # Official installer scripts from the tool's own repo (trivy) and a
        # version-pinned release tarball fetched by exact tag (gitleaks),
        # same pattern smilinTux/skstacks's skred-scan.yml accepts for the
        # same reason: there is no non-curl install path for either tool on
        # a bare ubuntu-latest runner, and the runner is ephemeral. Excluded
        # below from the semgrep step via --exclude-rule (a YAML-comment
        # nosemgrep did not suppress this rule's match in testing).
        run: |
          curl -fsSL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b "$HOME/.local/bin"
          GL=8.21.2
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GL}/gitleaks_${GL}_linux_x64.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" gitleaks
          pip install semgrep
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: gitleaks (secret scan, full history)
        run: gitleaks detect --source . --no-banner --exit-code 1

      - name: trivy filesystem scan (deps + config), fail on HIGH/CRITICAL
        run: |
          trivy fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --exit-code 1 .

      - name: semgrep (auto ruleset), fail on ERROR-severity findings
        # --severity ERROR mirrors skstacks's "fail on HIGH+": a WARNING-level
        # finding (e.g. an unpinned @v4 action tag) is tracked but does not
        # block the gate on its own; an ERROR-level one does. The one
        # --exclude-rule is the curl-pipe-shell installer step above, a
        # deliberate, documented choice, not an unreviewed suppression.
        run: |
          semgrep scan --config auto --severity ERROR \
            --exclude-rule yaml.github-actions.security.gha-curl-pipe-shell.gha-curl-pipe-shell \
            --error --json --output "$GITHUB_WORKSPACE/semgrep-report.json" .

      - name: estate denylist gate (patterns from a private secret)
        # Fork PRs cannot read secrets; they still get the three scans above.
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        env:
          ESTATE_DENYLIST: ${{ secrets.ESTATE_DENYLIST }}
        run: |
          # grep -f with an empty pattern file matches every line, so an
          # unset secret must produce zero patterns to check, not one empty
          # one. printf on an unset/empty var plus -v drop any blank or
          # comment line, so deny.txt is truly empty until an operator
          # provisions a real denylist.
          printf '%s\n' "$ESTATE_DENYLIST" | grep -v '^[[:space:]]*$' | grep -v '^#' > "$RUNNER_TEMP/deny.txt" || true
          if [ -s "$RUNNER_TEMP/deny.txt" ]; then
            if grep -ril -f "$RUNNER_TEMP/deny.txt" --exclude-dir=.git .; then
              echo "::error::estate denylist match found above" >&2
              exit 1
            fi
          else
            echo "ESTATE_DENYLIST is not provisioned yet (or has no non-empty lines); nothing to check."
          fi

      - name: upload findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skred-report
          path: semgrep-report.json
