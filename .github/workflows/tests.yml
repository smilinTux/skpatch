name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: install skpatch + dev deps
        run: python -m pip install -e ".[dev]"

      - name: black --check
        run: black --check --line-length 110 src/ tests/

      - name: pytest
        run: |
          mkdir -p "$RUNNER_TEMP/pytest-basetemp"
          python -m pytest tests/ -v --basetemp="$RUNNER_TEMP/pytest-basetemp"
